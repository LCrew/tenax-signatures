# Quick start:   cp .env.example .env && docker compose up -d --build && docker compose logs signature
# With HTTPS:    docker compose --profile tls up -d --build    (needs DNS for TLS_HOST and ports 80/443)
services:
  signature:
    build: .
    image: tenax/signature-service:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
    ports:
      - "${HOST_PORT:-8085}:8085"
    volumes:
      - sig-data:/data

  # Optional: automatic HTTPS in front of the service. Set TRUST_PROXY=true in .env when using it.
  caddy:
    image: caddy:2
    profiles: ["tls"]
    restart: unless-stopped
    depends_on: [signature]
    environment:
      TLS_HOST: ${TLS_HOST:-sig.tenaxgrupa.lv}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  sig-data:
  caddy-data:
